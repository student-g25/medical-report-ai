<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Medify — Report Results</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        min-height: 100vh;
        font-family:
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;

        color: #17233d;

        background:
          radial-gradient(
            circle at 10% 15%,
            rgba(91, 103, 235, 0.13),
            transparent 28%
          ),
          radial-gradient(
            circle at 90% 25%,
            rgba(53, 181, 177, 0.12),
            transparent 28%
          ),
          linear-gradient(135deg, #f7f8fc, #f4f8fc, #f1f8f8);

        transition:
          background 0.35s ease,
          color 0.35s ease;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      button {
        font: inherit;
      }

      /* =========================
           NAVBAR
        ========================= */

      .navbar {
        position: sticky;
        top: 18px;
        z-index: 1000;

        width: calc(100% - 48px);
        max-width: 1400px;

        margin: 18px auto 0;

        border: 1px solid rgba(255, 255, 255, 0.75);
        border-radius: 22px;

        background: rgba(255, 255, 255, 0.67);

        backdrop-filter: blur(22px);
        -webkit-backdrop-filter: blur(22px);

        box-shadow: 0 15px 45px rgba(30, 43, 80, 0.08);

        transition: 0.3s ease;
      }

      .navbar.scrolled {
        width: min(1180px, calc(100% - 70px));
        top: 10px;
        margin-top: 10px;
        border-radius: 18px;
      }

      .nav-container {
        min-height: 80px;

        display: flex;
        align-items: center;
        justify-content: space-between;

        padding: 0 25px;
      }

      .logo {
        display: flex;
        align-items: center;
        gap: 12px;

        font-size: 25px;
        font-weight: 800;
      }

      /* =========================================================
                    MEDIFY IMAGE LOGO
    ========================================================= */

      .site-logo {
        display: block;

        width: 185px;
        height: 58px;

        object-fit: contain;
        object-position: left center;

        background: transparent;

        transform: scale(1.18);
        transform-origin: left center;

        transition: opacity 0.25s ease;
      }

      .nav-right {
        display: flex;
        align-items: center;
        gap: 30px;
      }

      .nav-links {
        display: flex;
        gap: 32px;
      }

      .nav-links a {
        color: #596982;
        font-size: 15px;
        font-weight: 600;
      }

      .nav-links a:hover {
        color: #5966e9;
      }

      .theme-toggle {
        width: 45px;
        height: 45px;

        border: 1px solid rgba(89, 102, 233, 0.15);
        border-radius: 14px;

        cursor: pointer;

        background: rgba(255, 255, 255, 0.7);
        color: #5966e9;

        font-size: 19px;
      }

      /* =========================
           MAIN
        ========================= */

      .results-main {
        width: min(1180px, calc(100% - 40px));

        margin: auto;

        padding: 90px 0 80px;
      }

      .page-heading {
        text-align: center;
        max-width: 850px;

        margin: 0 auto 45px;
      }

      .section-label {
        display: inline-block;

        margin-bottom: 14px;

        color: #5966e9;

        font-size: 12px;
        font-weight: 800;
        letter-spacing: 2px;
      }

      .page-heading h1 {
        font-size: clamp(40px, 6vw, 65px);
        line-height: 1.05;
        letter-spacing: -3px;
      }

      .page-heading h1 span {
        background: linear-gradient(90deg, #5966e9, #36b7b2);

        -webkit-background-clip: text;
        background-clip: text;

        color: transparent;
      }

      .page-heading p {
        margin-top: 18px;

        color: #71819d;

        line-height: 1.7;
        font-size: 16px;
      }

      /* =========================
           CARDS
        ========================= */

      .glass-card {
        border: 1px solid rgba(255, 255, 255, 0.8);
        border-radius: 27px;

        background: rgba(255, 255, 255, 0.62);

        backdrop-filter: blur(25px);
        -webkit-backdrop-filter: blur(25px);

        box-shadow: 0 25px 65px rgba(40, 55, 90, 0.08);
      }

      .overview {
        display: grid;

        grid-template-columns: 1.5fr 0.8fr;

        gap: 20px;
      }

      .summary-card,
      .patient-card {
        padding: 32px;
      }

      .card-label {
        color: #5966e9;

        font-size: 11px;
        font-weight: 800;

        letter-spacing: 1.6px;
      }

      .summary-card h2,
      .patient-card h2 {
        margin-top: 8px;

        color: #17243d;

        font-size: 28px;
      }

      .summary-card p {
        margin-top: 16px;

        color: #5e6d84;

        line-height: 1.75;
      }

      /* =========================
           PATIENT
        ========================= */

      .patient-grid {
        display: grid;

        grid-template-columns: repeat(2, 1fr);

        gap: 12px;

        margin-top: 20px;
      }

      .patient-item {
        padding: 15px;

        border-radius: 17px;

        background: rgba(247, 249, 253, 0.8);
        border: 1px solid #e4e9f1;
      }

      .patient-item span {
        display: block;

        color: #8b98ac;

        font-size: 10px;
        font-weight: 800;

        text-transform: uppercase;
        letter-spacing: 1px;
      }

      .patient-item strong {
        display: block;

        margin-top: 6px;

        color: #1b2943;
      }

      /* =========================
           CONTENT
        ========================= */

      .content-card {
        margin-top: 24px;
        padding: 34px;
      }

      .content-heading {
        margin-bottom: 28px;
      }

      .content-heading h2 {
        margin-top: 7px;

        color: #17243d;

        font-size: 29px;
      }

      .content-heading p {
        margin-top: 8px;

        color: #7b8aa1;

        line-height: 1.6;
      }

      /* =========================
           TEST SECTIONS
        ========================= */

      .metric-section {
        margin-top: 25px;
        padding: 25px;

        border-radius: 22px;

        background: rgba(255, 255, 255, 0.58);
        border: 1px solid #e0e6ef;
      }

      .metric-section:first-child {
        margin-top: 0;
      }

      .section-title {
        display: flex;
        align-items: center;

        gap: 12px;

        color: #18253e;

        font-size: 20px;
        font-weight: 800;
      }

      .section-icon {
        width: 40px;
        height: 40px;

        display: flex;
        align-items: center;
        justify-content: center;

        border-radius: 13px;

        background: linear-gradient(
          135deg,
          rgba(89, 102, 233, 0.13),
          rgba(54, 183, 178, 0.14)
        );
      }

      .metric-list {
        display: grid;
        gap: 13px;

        margin-top: 20px;
      }

      .metric-row {
        padding: 21px;

        border-radius: 18px;

        background: rgba(250, 252, 255, 0.8);

        border: 1px solid #e3e8f0;
      }

      .metric-top {
        display: flex;

        justify-content: space-between;
        align-items: flex-start;

        gap: 15px;
      }

      .metric-name {
        color: #172640;

        font-size: 16px;
        font-weight: 800;
      }

      .metric-status {
        padding: 7px 11px;

        border-radius: 999px;

        font-size: 11px;
        font-weight: 800;

        white-space: nowrap;
      }

      .status-normal {
        color: #148772;
        background: #e8f8f3;
      }

      .status-high,
      .status-low {
        color: #a36a00;
        background: #fff4dd;
      }

      .status-unknown {
        color: #667085;
        background: #edf0f4;
      }

      .metric-values {
        display: grid;

        grid-template-columns: repeat(3, 1fr);

        gap: 12px;

        margin-top: 17px;
      }

      .value-box {
        padding: 13px 15px;

        border-radius: 14px;

        background: #f1f5fa;
      }

      .value-box span {
        display: block;

        color: #8996aa;

        font-size: 10px;
        font-weight: 800;

        text-transform: uppercase;
        letter-spacing: 0.7px;
      }

      .value-box strong {
        display: block;

        margin-top: 6px;

        color: #1b2942;

        font-size: 14px;
      }

      .explanation {
        margin-top: 16px;
        padding: 16px 18px;

        border-left: 3px solid #5966e9;
        border-radius: 0 13px 13px 0;

        background: rgba(89, 102, 233, 0.055);

        color: #52627b;

        line-height: 1.65;
        font-size: 14px;
      }

      .explanation strong {
        display: block;

        margin-bottom: 5px;

        color: #5966e9;

        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      /* =========================
           INFORMATION BOXES
        ========================= */

      .info-grid {
        display: grid;

        grid-template-columns: repeat(3, 1fr);

        gap: 18px;

        margin-top: 24px;
      }

      .info-card {
        padding: 25px;

        border-radius: 23px;

        background: rgba(255, 255, 255, 0.62);

        border: 1px solid rgba(255, 255, 255, 0.8);

        box-shadow: 0 18px 45px rgba(40, 55, 90, 0.06);
      }

      .info-card h3 {
        color: #18253e;

        font-size: 18px;
      }

      .info-card ul {
        margin-top: 15px;
        padding-left: 20px;

        color: #596a82;

        line-height: 1.7;
        font-size: 14px;
      }

      .info-card li {
        margin-bottom: 8px;
      }

      /* =========================
           DISCLAIMER
        ========================= */

      .disclaimer {
        margin-top: 24px;
        padding: 22px 25px;

        border-radius: 20px;

        background: rgba(255, 249, 232, 0.8);

        border: 1px solid #f2dfae;

        color: #765d27;

        line-height: 1.65;

        font-size: 13px;
      }

      /* =========================
           ACTIONS
        ========================= */

      .actions {
        display: flex;
        justify-content: center;

        gap: 14px;

        margin-top: 35px;
      }

      .btn {
        border: none;

        padding: 14px 23px;

        border-radius: 15px;

        cursor: pointer;

        font-weight: 700;

        transition: 0.25s ease;
      }

      .btn-primary {
        color: white;

        background: linear-gradient(135deg, #5966e9, #36b7b2);

        box-shadow: 0 10px 25px rgba(89, 102, 233, 0.2);
      }

      .btn-secondary {
        color: #5966e9;

        background: rgba(255, 255, 255, 0.75);

        border: 1px solid #dfe5ef;
      }

      .btn:hover {
        transform: translateY(-2px);
      }

      /* =========================
           EMPTY / ERROR
        ========================= */

      .empty-state {
        text-align: center;

        padding: 70px 25px;
      }

      .empty-state h2 {
        color: #17243d;
      }

      .empty-state p {
        margin-top: 10px;

        color: #71819d;
      }

      /* =========================
           DARK MODE
        ========================= */

      body.dark {
        color: #edf2ff;

        background:
          radial-gradient(
            circle at 10% 15%,
            rgba(89, 102, 233, 0.16),
            transparent 28%
          ),
          radial-gradient(
            circle at 90% 25%,
            rgba(54, 183, 178, 0.12),
            transparent 28%
          ),
          #0c1220;
      }

      body.dark .navbar,
      body.dark .glass-card,
      body.dark .info-card {
        background: rgba(20, 28, 45, 0.72);

        border-color: rgba(255, 255, 255, 0.08);
      }

      body.dark .logo,
      body.dark .summary-card h2,
      body.dark .patient-card h2,
      body.dark .content-heading h2,
      body.dark .section-title,
      body.dark .metric-name,
      body.dark .info-card h3,
      body.dark .empty-state h2 {
        color: #edf2ff;
      }

      body.dark .nav-links a,
      body.dark .page-heading p,
      body.dark .summary-card p,
      body.dark .content-heading p,
      body.dark .metric-explanation,
      body.dark .info-card li {
        color: #9eabc1;
      }

      body.dark .theme-toggle,
      body.dark .btn-secondary {
        background: rgba(255, 255, 255, 0.07);
        border-color: rgba(255, 255, 255, 0.1);
      }

      body.dark .patient-item,
      body.dark .metric-row,
      body.dark .metric-section,
      body.dark .value-box {
        background: rgba(255, 255, 255, 0.045);
        border-color: rgba(255, 255, 255, 0.08);
      }

      body.dark .patient-item strong,
      body.dark .value-box strong {
        color: #e7edfb;
      }

      body.dark .explanation {
        background: rgba(89, 102, 233, 0.09);
      }

      body.dark .disclaimer {
        background: rgba(120, 91, 25, 0.18);
        border-color: rgba(215, 173, 76, 0.25);
        color: #dbc78e;
      }

      /* =========================
           RESPONSIVE
        ========================= */

      @media (max-width: 900px) {
        .overview {
          grid-template-columns: 1fr;
        }

        .info-grid {
          grid-template-columns: 1fr;
        }

        .nav-links {
          display: none;
        }

        .metric-values {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 600px) {
        .navbar {
          width: calc(100% - 22px);
          top: 8px;
          margin-top: 8px;
        }

        .nav-container {
          min-height: 65px;
          padding: 0 15px;
        }

        .logo {
          font-size: 20px;
        }

        .logo-mark {
          width: 40px;
          height: 40px;

          font-size: 22px;
        }

        .results-main {
          width: calc(100% - 22px);
          padding-top: 65px;
        }

        .page-heading h1 {
          letter-spacing: -2px;
        }

        .summary-card,
        .patient-card,
        .content-card {
          padding: 22px;
        }

        .metric-section {
          padding: 18px;
        }

        .metric-top {
          flex-direction: column;
        }

        .actions {
          flex-direction: column;
        }

        .btn {
          width: 100%;
        }
      }

      /* =========================================================
   ANALYSIS → RESULTS ENTRANCE
========================================================= */

      body.results-enter {
        overflow-x: hidden;
      }

      body.results-enter .navbar {
        opacity: 0;
        transform: translateY(-14px);
        animation: resultsNavbarIn 0.55s cubic-bezier(0.4, 0, 0.2, 1) 0.05s
          forwards;
      }

      body.results-enter .results-main {
        opacity: 0;
        transform: translateY(20px) scale(0.985);

        animation: resultsContentIn 0.65s cubic-bezier(0.4, 0, 0.2, 1) 0.12s
          forwards;
      }

      @keyframes resultsNavbarIn {
        from {
          opacity: 0;
          transform: translateY(-14px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes resultsContentIn {
        from {
          opacity: 0;
          transform: translateY(20px) scale(0.985);
        }

        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
    </style>
  </head>

  <body>
    <script>
      /* Restore theme before the Results page is displayed */
      const resultTheme =
        sessionStorage.getItem("medifyTheme") ||
        localStorage.getItem("medify-theme");

      if (resultTheme === "dark") {
        document.body.classList.add("dark");
      }

      sessionStorage.removeItem("medifyTheme");

      /* Preserve the Analysis → Results entrance transition */
      if (sessionStorage.getItem("medifyAnalysisTransition") === "true") {
        document.body.classList.add("results-enter");
        sessionStorage.removeItem("medifyAnalysisTransition");
      }
    </script>
    <header class="navbar" id="navbar">
      <div class="nav-container">
        <a href="index.html" class="logo" aria-label="Medify home">
          <img src="assets/medify-logo.png" alt="Medify" class="site-logo" />
        </a>

        <div class="nav-right">
          <nav class="nav-links">
            <a href="index.html">Home</a>

            <a href="upload.html">Analyze Report</a>
          </nav>

          <button
            class="theme-toggle"
            id="themeToggle"
            type="button"
            aria-label="Toggle theme"
          >
            ☾
          </button>
        </div>
      </div>
    </header>

    <main class="results-main">
      <!-- PAGE HEADING -->

      <section class="page-heading">
        <div class="section-label">YOUR REPORT</div>

        <h1>
          Understand your
          <span>health report.</span>
        </h1>

        <p>
          Medify has organized the information extracted from your medical
          report into a simpler, easier-to-understand format.
        </p>
      </section>

      <!-- RESULTS ARE INSERTED HERE -->

      <div id="resultsContainer"></div>
    </main>

    <script>
      /* =========================================================
       GET BACKEND RESPONSE
    ========================================================= */

      const storedReport = sessionStorage.getItem("medifyReport");

      const filename =
        sessionStorage.getItem("medifyReportFilename") || "Medical Report";

      const container = document.getElementById("resultsContainer");

      /* =========================================================
       THEME
    ========================================================= */

      const themeToggle = document.getElementById("themeToggle");

      const savedTheme = localStorage.getItem("medifyTheme");

      if (savedTheme === "dark") {
        document.body.classList.add("dark");
        themeToggle.textContent = "☀";
      }

      themeToggle.addEventListener("click", () => {
        document.body.classList.toggle("dark");

        const isDark = document.body.classList.contains("dark");

        localStorage.setItem("medifyTheme", isDark ? "dark" : "light");

        themeToggle.textContent = isDark ? "☀" : "☾";
      });

      /* =========================================================
       NAVBAR SCROLL
    ========================================================= */

      window.addEventListener("scroll", () => {
        const navbar = document.getElementById("navbar");

        navbar.classList.toggle("scrolled", window.scrollY > 40);
      });

      /* =========================================================
       ESCAPE HTML
       Prevents report text from being interpreted as HTML.
    ========================================================= */

      function escapeHTML(value) {
        if (value === null || value === undefined) {
          return "";
        }

        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      /* =========================================================
       STATUS CLASS
    ========================================================= */

      function getStatusClass(status) {
        const text = String(status || "").toLowerCase();

        if (text.includes("within")) {
          return "status-normal";
        }

        if (text.includes("above") || text.includes("high")) {
          return "status-high";
        }

        if (text.includes("below") || text.includes("low")) {
          return "status-low";
        }

        return "status-unknown";
      }

      /* =========================================================
       PATIENT INFORMATION
    ========================================================= */

      function renderPatient(patient) {
        if (!patient) {
          return `
                <div class="patient-card glass-card">

                    <div class="card-label">
                        PATIENT
                    </div>

                    <h2>
                        Information
                    </h2>

                    <div class="patient-grid">

                        <div class="patient-item">
                            <span>Age</span>
                            <strong>Not provided</strong>
                        </div>

                        <div class="patient-item">
                            <span>Sex</span>
                            <strong>Not provided</strong>
                        </div>

                    </div>

                </div>
            `;
        }

        return `
            <div class="patient-card glass-card">

                <div class="card-label">
                    PATIENT
                </div>

                <h2>
                    Information
                </h2>

                <div class="patient-grid">

                    <div class="patient-item">

                        <span>
                            Age
                        </span>

                        <strong>
                            ${escapeHTML(patient.age ?? "Not provided")}
                        </strong>

                    </div>


                    <div class="patient-item">

                        <span>
                            Sex
                        </span>

                        <strong>
                            ${escapeHTML(patient.sex ?? "Not provided")}
                        </strong>

                    </div>

                </div>

            </div>
        `;
      }

      /* =========================================================
       TEST CARD
    ========================================================= */

      function renderTest(test) {
        const status = test.status || "cannot be determined";

        const statusClass = getStatusClass(status);

        const value = test.reported_value ?? test.value ?? "Not provided";

        const unit = test.reported_unit ?? test.unit ?? "";

        const reference = test.reference_range ?? "Not provided";

        const explanation =
          test.simple_explanation ??
          test.explanation ??
          "No explanation was provided.";

        return `

            <article class="metric-row">

                <div class="metric-top">

                    <div class="metric-name">
                        ${escapeHTML(test.name || "Unnamed test")}
                    </div>

                    <div class="metric-status ${statusClass}">
                      ${escapeHTML(test.user_friendly_status || status)}
                    </div>

                </div>


                <div class="metric-values">

                    <div class="value-box">

                        <span>
                            Reported Value
                        </span>

                        <strong>
                            ${escapeHTML(value)}
                            ${unit ? " " + escapeHTML(unit) : ""}
                        </strong>

                    </div>


                    <div class="value-box">

                        <span>
                            Reference Range
                        </span>

                        <strong>
                            ${escapeHTML(reference)}
                        </strong>

                    </div>


                    <div class="value-box">

                        <span>
                            Report File
                        </span>

                        <strong>
                            ${escapeHTML(filename)}
                        </strong>

                    </div>

                </div>


                <div class="explanation">

                    <strong>
                        What this means
                    </strong>

                    ${escapeHTML(explanation)}

                </div>

            </article>

        `;
      }

      /* =========================================================
       TEST SECTION
    ========================================================= */

      function renderSection(section) {
        const tests = Array.isArray(section.tests) ? section.tests : [];

        if (!tests.length) {
          return "";
        }

        return `

            <section class="metric-section">

                <div class="section-title">

                    <div class="section-icon">
                        ${escapeHTML(section.icon || "🧪")}
                    </div>

                    ${escapeHTML(section.title || "Tests")}

                </div>


                <div class="metric-list">

                    ${tests.map(renderTest).join("")}

                </div>

            </section>

        `;
      }

      /* =========================================================
       FALLBACK FOR tests[]
    ========================================================= */

      function renderFallbackTests(tests) {
        if (!Array.isArray(tests) || !tests.length) {
          return `
                <div class="empty-state">

                    <h2>
                        No test results available
                    </h2>

                    <p>
                        The report did not contain enough
                        verified test information to display.
                    </p>

                </div>
            `;
        }

        return `

            <section class="metric-section">

                <div class="section-title">

                    <div class="section-icon">
                        🧪
                    </div>

                    Test Results

                </div>

                <div class="metric-list">

                    ${tests.map(renderTest).join("")}

                </div>

            </section>

        `;
      }

      /* =========================================================
       LIST ITEMS
    ========================================================= */

      function renderList(items) {
        if (!Array.isArray(items) || !items.length) {
          return `
                <li>
                    No additional information provided.
                </li>
            `;
        }

        return items
          .map(
            (item) => `
                <li>
                    ${escapeHTML(item)}
                </li>
            `,
          )
          .join("");
      }

      /* =========================================================
       MAIN RENDER
    ========================================================= */

      function renderResults(data) {
        const interpretation = data.interpretation || {};

        const patient = data.patient_info || data.patient || null;

        const summary =
          interpretation.summary || "No summary was provided for this report.";

        const sections = Array.isArray(interpretation.sections)
          ? interpretation.sections
          : [];

        const tests = Array.isArray(interpretation.tests)
          ? interpretation.tests
          : [];

        /* =========================
           TEST CONTENT
        ========================= */

        let testsHTML = "";

        if (sections.length) {
          testsHTML = sections.map(renderSection).join("");
        } else {
          testsHTML = renderFallbackTests(tests);
        }

        /* =========================
           PAGE
        ========================= */

        container.innerHTML = `

            <section class="overview">

                <div class="summary-card glass-card">

                    <div class="card-label">
                        REPORT SUMMARY
                    </div>

                    <h2>
                        What your report says
                    </h2>

                    <p>
                        ${escapeHTML(summary)}
                    </p>

                </div>


                ${renderPatient(patient)}

            </section>


            <section class="content-card glass-card">

                <div class="content-heading">

                    <div class="card-label">
                        DETAILED RESULTS
                    </div>

                    <h2>
                        Your test results
                    </h2>

                    <p>
                        Each result below keeps the value and
                        reference range from the analyzed report.
                    </p>

                </div>

                ${testsHTML}

            </section>


            <div class="info-grid">

                <section class="info-card">

                    <h3>
                        Important points
                    </h3>

                    <ul>
                        ${renderList(interpretation.important_points)}
                    </ul>

                </section>


                <section class="info-card">

                    <h3>
                        Questions for your doctor
                    </h3>

                    <ul>
                        ${renderList(
                          interpretation.doctor_discussion_questions,
                        )}
                    </ul>

                </section>


                <section class="info-card">

                    <h3>
                        Limitations
                    </h3>

                    <ul>
                        ${renderList(interpretation.limitations)}
                    </ul>

                </section>

            </div>


            <div class="disclaimer">

                <strong>
                    Important:
                </strong>

                Medify provides educational explanations of
                information contained in a medical report.
                It does not replace a qualified healthcare
                professional's evaluation or diagnosis.

            </div>


            <div class="actions">

                <button
                    class="btn btn-primary"
                    onclick="window.location.href='upload.html'"
                >
                    Analyze another report
                </button>

                <button
                    class="btn btn-secondary"
                    onclick="window.location.href='index.html'"
                >
                    Back to home
                </button>

            </div>

        `;
      }

      /* =========================================================
       LOAD DATA
    ========================================================= */

      if (!storedReport) {
        container.innerHTML = `

            <section class="glass-card empty-state">

                <h2>
                    No report found
                </h2>

                <p>
                    Please upload and analyze a medical report
                    first.
                </p>

                <div class="actions">

                    <button
                        class="btn btn-primary"
                        onclick="window.location.href='upload.html'"
                    >
                        Upload a report
                    </button>

                </div>

            </section>

        `;
      } else {
        try {
          const data = JSON.parse(storedReport);

          renderResults(data);
        } catch (error) {
          console.error("Could not read stored report:", error);

          container.innerHTML = `

                <section class="glass-card empty-state">

                    <h2>
                        Unable to display the report
                    </h2>

                    <p>
                        The analyzed report data could not
                        be read correctly.
                    </p>

                    <div class="actions">

                        <button
                            class="btn btn-primary"
                            onclick="window.location.href='upload.html'"
                        >
                            Analyze again
                        </button>

                    </div>

                </section>

            `;
        }
      }
    </script>
  </body>
</html>
